[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orion-api"
version = "0.1.0"
description = "API da plataforma ORION para inteligência de licitações públicas"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "uvicorn[standard]>=0.32,<1.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "pytest-asyncio>=0.24,<1.0", "respx>=0.21,<1.0", "ruff>=0.7,<1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/orion_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312